# Blind requirement list for the Intel 82540EM core network path (legacy descriptors).
# Derived only from the Intel PCI/PCI-X Family of Gigabit Ethernet Controllers
# Software Developer's Manual, document 317453-006, revision 4.0.

# ---------------------------------------------------------------- PCI
- id: E1000-PCI-001
  statement: >-
    The driver identifies the 82540EM by PCI vendor 8086h with device 100Eh (desktop part) or
    1015h (mobile part); a driver that matches only one of the two misses half the parts.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "5.2 Component Identification Via Programming Interface, Table 5-1 Component Identification"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    The same table lists 82540EP as 1017h (desktop) and 1016h (mobile). Vendor and device IDs can
    be loaded from the EEPROM (4.1 PCI Configuration, Vendor ID / Device ID), so a board could
    present other values; the table gives the defaults.

- id: E1000-PCI-002
  statement: >-
    The device's internal registers are reached through a memory BAR at configuration offset 10h
    (BAR0). It decodes a 128 KB window, is non-prefetchable because register reads have side
    effects, and register offsets are taken from the base of that window. Depending on the EEPROM
    BAR32 bit, BAR0 is either a 32-bit BAR or the low half of a 64-bit BAR (type field 10b) whose
    upper 32 bits are in the BAR at 14h. The driver must read the type field and handle both forms.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "4.1 PCI Configuration, Table 4-2 Base Address Registers (64-bit and 32-bit layouts) and base address register field table (Type bits 2:1, Prefetch, Address)"
    - source: 317453-006 r4.0
      locator: "13.2.1.1 Memory-Mapped Access to Internal Registers and Memories"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PCI-003
  statement: >-
    Memory Access Enable (bit 1 of the PCI Command register) must be set before the register BAR
    responds. The Command register comes out of reset with it cleared.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "4.1 PCI Configuration, Table 4-3 Command Register Layout (bit 1 Memory Access Enable, initial 0b)"
    - source: 317453-006 r4.0
      locator: "14.8 Initialization of Statistics (internal registers become accessible when Memory Access Enable is set)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PCI-004
  statement: >-
    Bus mastering (bit 2 of the PCI Command register) must be enabled or the device cannot DMA
    descriptors or packet data. It resets to disabled.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "4.1 PCI Configuration, Table 4-3 Command Register Layout (bit 2 Enable Mastering, initial 0b)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PCI-005
  statement: >-
    All DMA addresses the device masters (descriptor ring bases and buffer addresses in
    descriptors) are 64-bit physical bus addresses. A ring base is split across a low and a high
    32-bit register, and the high register must be written (with zero on a 32-bit system) because
    it has no reset value.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "2.4 DMA Addressing"
    - source: 317453-006 r4.0
      locator: "13.4.26 Receive Descriptor Base Address High (RDBAH), Table 13-71 (initial X)"
    - source: 317453-006 r4.0
      locator: "13.4.37 Transmit Descriptor Base Address High (TDBAH), Table 13-80 (initial X)"
  weight: critical
  in_scope: true
  status: active

# ---------------------------------------------------------------- REG
- id: E1000-REG-001
  statement: >-
    Every device register is 32 bits wide and must be accessed with full 32-bit reads and writes.
    The device ignores writes narrower than 32 bits.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.2 Register Conventions"
  weight: critical
  in_scope: true
  status: active

# ---------------------------------------------------------------- INIT
- id: E1000-INIT-001
  statement: >-
    A software device reset is started by setting CTRL.RST (bit 26 of CTRL at 0000h). The bit clears
    itself. After setting it, the driver must wait about 1 microsecond before touching any device
    register, including reading CTRL back to see whether the bit has cleared.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.1 Device Control Register (CTRL), Table 13-3 CTRL Register Bit Description, RST bit 26"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    The text rendering prints the wait as "approximately 1 s" because it drops the micro sign. The
    PDF page (printed page 228) reads 1 microsecond.

- id: E1000-INIT-002
  statement: >-
    The receive-address registers keep their contents across a device reset, but the reset clears
    the address-valid bit in each RAH. After every reset the driver must reprogram RAL0 and RAH0
    with the valid bit set.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "14.7 Reset Operation (Global Reset register table and closing paragraph on RAH/RAL)"
    - source: 317453-006 r4.0
      locator: "13.5.3 Receive Address High (RAH), Table 13-91, AV bit 31"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Split after the second reading. The ring-base part is now E1000-INIT-007. The multicast table
    also has no reset value (14.7); zeroing it is not a row in this list.

- id: E1000-INIT-003
  statement: >-
    For normal operation with the internal copper PHY, CTRL.PHY_RST (bit 31) must be 0. While it is
    1, the internal PHY is held in reset.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "14.3 General Configuration"
    - source: 317453-006 r4.0
      locator: "13.4.1 Device Control Register (CTRL), Table 13-3, PHY_RST bit 31"
  weight: critical
  in_scope: true
  status: active
  notes: Split after the second reading. The ILOS part is now E1000-INIT-008.

- id: E1000-INIT-004
  statement: >-
    CTRL.FRCSPD (bit 11) has a hardware initial value of 1. While it is set, the MAC runs at the
    speed in CTRL.SPEED (initial value 1000 Mb/s), whatever ASDE says. The MAC speed must match the
    PHY's resolved speed. Software does that either by clearing FRCSPD, so the PHY's speed
    indication or the ASD function sets it, or by leaving FRCSPD set and writing CTRL.SPEED from
    the PHY's resolved speed after each link-up. Setting ASDE alone does not do it.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.1 Device Control Register (CTRL), Table 13-3, FRCSPD bit 11 (initial 1b), SPEED bits 9:8 (initial 10b), ASDE bit 5"
    - source: 317453-006 r4.0
      locator: "8.6.2.2.1 Forcing Speed"
    - source: 317453-006 r4.0
      locator: "8.6.4 Internal PHY Mode Control Bit Resolution, Tables 8-6 through 8-8"
    - source: 317453-006 r4.0
      locator: "8.6.2.2.3 Automatic Detection of Link Speed using SPD-IND"
    - source: 317453-006 r4.0
      locator: "14.5.5 Link Setup (examples 1 and 2: FRCSPD=1 with software-written SPEED; FRCSPD=0 with ASDE=1)"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    FRCSPD is EEPROM-configurable, so on many boards the EEPROM may already clear it. A link
    partner at 10 or 100 Mb/s exposes a driver that leaves it set without writing SPEED. After the
    second reading, the "or enable ASDE" alternative was removed. The FRCSPD bit definition says
    ASD sets the speed only when FRCSPD is cleared, and Table 8-8 shows the speed forced with ASDE
    don't-care. The CTRL.SPEED field text ("ignored when ASDE is enabled") seems to say otherwise;
    FRCSPD's own definition and Table 8-8 decide it. FRCDPLX resets to 0 and affects duplex, not
    speed.

- id: E1000-INIT-005
  statement: >-
    Each ring's registers (base, length, head, tail) and its descriptors are programmed before that
    ring's enable bit (RCTL.EN or TCTL.EN) is set.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "14.4 Receive Initialization (RCTL.EN bullet); 14.5 Transmit Initialization"
    - source: 317453-006 r4.0
      locator: "13.4.28 Receive Descriptor Head (RDH); 13.4.39 Transmit Descriptor Head (TDH)"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    After the second reading, the "receive setup before transmit setup" ordering was dropped. The
    manual only presents the sections in that order; it does not require it.

- id: E1000-INIT-006
  statement: >-
    To tear the device down safely, the driver masks all interrupts through IMC, clears RCTL.EN and
    TCTL.EN, and then issues a device reset (CTRL.RST, observing the 1 microsecond wait). Only
    after that may it free or reuse descriptor-ring and buffer memory.
  class: inference
  premises:
    - text: Clearing RCTL.EN stops reception only after any in-progress packet; data remains in the FIFO and the receiver must be reset before re-enabling.
      source: 317453-006 r4.0
      locator: "13.4.22 Receive Control Register (RCTL), Table 13-67, EN bit 1"
    - text: Clearing TCTL.EN stops only after in-progress packets; flushing the FIFO requires combining it with reset.
      source: 317453-006 r4.0
      locator: "13.4.33 Transmit Control Register (TCTL), Table 13-76, EN bit 1"
    - text: CTRL.RST returns all receive, transmit, and interrupt registers and state machines to power-on values.
      source: 317453-006 r4.0
      locator: "13.4.1 Device Control Register (CTRL), Table 13-3, RST bit 26"
    - text: Interrupts are disabled by writing 1s to IMC.
      source: 317453-006 r4.0
      locator: "13.4.21 Interrupt Mask Clear Register (IMC)"
  derivation:
    - source: 317453-006 r4.0
      locator: "14.7 Reset Operation, Global Reset"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    The manual has no teardown section. Because disabling only stops at a packet boundary, DMA into
    the ring can continue briefly after the enable bit is cleared, and freeing memory then is a
    use-after-free by the device. Whether clearing the enable bits alone would ever be enough is
    not stated. RCTL has no receiver-only reset on this part (bit 0 is reserved), so CTRL.RST is the
    reset available.

- id: E1000-INIT-007
  statement: >-
    A device reset does not set the RX and TX descriptor ring base registers (RDBAL/RDBAH,
    TDBAL/TDBAH) to any value. After every reset the driver must program all four before enabling
    the rings, and must not rely on values left from before the reset.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "14.7 Reset Operation (Global Reset register table: RDBAH/RDBAL and TDBAH/TDBAL exceptions; closing paragraph)"
    - source: 317453-006 r4.0
      locator: "13.4.25 RDBAL Table 13-70; 13.4.26 RDBAH Table 13-71; 13.4.36 TDBAL Table 13-79; 13.4.37 TDBAH Table 13-80 (initial X)"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Split out of E1000-INIT-002 after the second reading. E1000-PCI-005 covers the related need to
    write the high halves for 64-bit addressing.

- id: E1000-INIT-008
  statement: >-
    CTRL.ILOS (bit 7) must be 0 when the internal PHY is used. Inverting the loss-of-signal
    polarity breaks the MAC's reading of the PHY link signal.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.1 Device Control Register (CTRL), Table 13-3, ILOS bit 7"
    - source: 317453-006 r4.0
      locator: "14.3 General Configuration"
  weight: critical
  in_scope: true
  status: active
  notes: Split out of E1000-INIT-003 after the second reading.

# ---------------------------------------------------------------- EEPROM
- id: E1000-EEPROM-001
  statement: >-
    To read an EEPROM word through the EEPROM Read register (EERD at 0014h), software writes the
    word address and a 1 in the Start bit in a single write. On the 82540EM the address field is
    bits 15:8 and Start is bit 0.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.4 EEPROM Read Register (EERD), Table 13-7 EEPROM Read Register Bit Description"
    - source: 317453-006 r4.0
      locator: "5.3.1 Software Access"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Table 13-8 gives a different layout (address 15:2, Done bit 1) for the 82541xx and 82547GI/EI
    only. A spec that uses it for the 82540EM fails this row and E1000-EEPROM-002.

- id: E1000-EEPROM-002
  statement: >-
    After starting an EERD read, software polls until the Done bit (bit 4 on the 82540EM) reads 1.
    Only then does it take the 16-bit word from bits 31:16 of the same register.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.4 EEPROM Read Register (EERD), Table 13-7 (DONE bit 4, DATA bits 31:16)"
    - source: 317453-006 r4.0
      locator: "5.3.1 Software Access"
  weight: critical
  in_scope: true
  status: active

- id: E1000-EEPROM-003
  statement: >-
    The EERD field layout differs by controller. The 82541xx/82547 layout (address in bits 15:2,
    Done in bit 1) is wrong for the 82540EM, which uses address 15:8 and Done in bit 4. A driver
    must use the 82540EM layout.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.4 EEPROM Read Register (EERD), Table 13-7 vs Table 13-8 (82541xx and 82547GI/EI)"
  weight: critical
  in_scope: true
  status: withdrawn
  notes: >-
    Withdrawn after the second reading as a duplicate. E1000-EEPROM-001 (address 15:8, Start bit 0)
    and E1000-EEPROM-002 (Done bit 4, data 31:16) already fix the 82540EM layout, so a spec using
    the 82541/82547 layout (Table 13-8) fails those rows. The distinction is recorded in
    E1000-EEPROM-001's notes.

- id: E1000-EEPROM-004
  statement: >-
    The station MAC address is stored in EEPROM words 0, 1, and 2. Each word holds two address
    bytes with the lower-addressed (first-on-wire) byte in the word's low 8 bits. For example,
    address 12-34-56-78-90-AB is stored as words 3412h, 7856h, AB90h.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "5.6.1 Ethernet Address (Words 00h-02h)"
  weight: critical
  in_scope: true
  status: active

# ---------------------------------------------------------------- PHY
- id: E1000-PHY-001
  statement: >-
    PHY registers are reached only through the MDI Control register (MDIC at 0020h). Its fields
    are: data in bits 15:0, PHY register number in 20:16, PHY address in 25:21, opcode in 27:26
    (01b write, 10b read), Ready in bit 28, interrupt-on-completion in bit 29, and Error in bit 30.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.7 MDI Control Register (MDIC), Table 13-14 MDI Control Register Bit Description"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PHY-002
  statement: >-
    The internal PHY answers at MDI PHY address 1.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.7 MDI Control Register (MDIC), Table 13-14, PHYADD bits 25:21"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    14.6 PHY Initialization says in general terms that the PHY address can be anywhere from 0 to
    31 and software must determine it. The MDIC register definition, which governs, fixes the
    internal PHY at address 1 (the table prints "0001b").

- id: E1000-PHY-003
  statement: >-
    An MDIC transaction is one write of the whole command, with Ready cleared in that same write.
    Software then waits for the device to set Ready (by polling or through the MDI-complete
    interrupt). For a read, the PHY data is valid in bits 15:0 only after Ready is set.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.7 MDI Control Register (MDIC) (read and write procedures), Table 13-14, R bit 28"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PHY-004
  statement: >-
    The link-status bit (bit 2) of PHY register 1 is latched low: it reports whether link was lost
    since the last read. To get current link state, read the register twice back to back and use
    the second value (or use the real-time link bit in the PHY-specific status register).
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.7.1.2 PHY Status Register (PSTATUS), Table 13-17, Link Status bit 2 (mode RO,LL)"
    - source: 317453-006 r4.0
      locator: "13.4.7.1 PHY Registers, Table 13-15 PHY Register Bit Mode Definitions (LL)"
  weight: important
  in_scope: true
  status: active

- id: E1000-PHY-005
  statement: >-
    The MAC does not recognize the PHY's link indication, and does not pass traffic, until software
    sets CTRL.SLU (bit 6). Its initial value is 0 unless the EEPROM enables APM or SMBus.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.1 Device Control Register (CTRL), Table 13-3, SLU bit 6"
    - source: 317453-006 r4.0
      locator: "8.6.2.1 Auto-Negotiation (Internal GMII/MII Mode)"
    - source: 317453-006 r4.0
      locator: "14.5.5 Link Setup, Note"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PHY-006
  statement: >-
    The MAC's view of the link is read from the Device Status register (STATUS at 0008h): link up
    in bit 1, full duplex in bit 0, and resolved speed in bits 7:6 (00 = 10, 01 = 100,
    10 or 11 = 1000 Mb/s).
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.2 Device Status Register (STATUS), Table 13-5 Status Register Bit Description (FD, LU, SPEED)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-PHY-007
  statement: >-
    Before issuing an MDIC command, software makes sure the Error bit (bit 30) is clear. If Error
    is set when a read completes, the read failed and the data field must not be used.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.7 MDI Control Register (MDIC), Table 13-14, E bit 30"
  weight: important
  in_scope: true
  status: active
  notes: >-
    Added after the second reading. The reader proposed it as critical. I weighted it important:
    leaving it out causes harm only when an MDI read fails, which is a fault path, not normal
    operation. The manual does not say how software clears the bit (presumably by writing the
    next command with E = 0).

# ---------------------------------------------------------------- RX
- id: E1000-RX-001
  statement: >-
    A legacy receive descriptor is 16 bytes. Bytes 0-7 hold the 64-bit buffer address. Bytes 8-9
    hold the length the hardware wrote, 10-11 the packet checksum, byte 12 the status, byte 13 the
    errors, and 14-15 the special (VLAN) field.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.3 Receive Descriptor Format, Table 3-1 Receive Descriptor (RDESC) Layout"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-002
  statement: >-
    The receive descriptor ring base (RDBAL/RDBAH at 2800h/2804h) must be 16-byte aligned. The
    low four address bits are ignored.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.25 Receive Descriptor Base Address Low (RDBAL), Table 13-70"
    - source: 317453-006 r4.0
      locator: "14.4 Receive Initialization"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-003
  statement: >-
    RDLEN (2808h) holds the ring size in bytes and must be a multiple of 128 (its low 7 bits read
    as zero), so the ring holds a multiple of 8 descriptors.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.27 Receive Descriptor Length (RDLEN), Table 13-72"
    - source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-004
  statement: >-
    RDH (2810h) and RDT (2818h) hold descriptor indexes, each pointing to a 16-byte descriptor, not
    byte offsets. Descriptor n lives at ring base + 16 * n.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure (head and tail pointers reference 16-byte blocks)"
    - source: 317453-006 r4.0
      locator: "13.4.28 Receive Descriptor Head (RDH); 13.4.29 Receive Descriptor Tail (RDT) (register points to a 16-byte datum)"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Split after the second reading. The rule for when RDH may be written is now E1000-RX-015. The
    citation now points at the receive sections instead of borrowing the transmit formula from 3.4.

- id: E1000-RX-005
  statement: >-
    Software hands receive buffers to hardware by writing RDT with the index one past the last
    descriptor it has filled. Hardware owns the descriptors from head up to but not including tail.
    When head equals tail the ring is empty and hardware stops storing packets.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure (and Note following Figure 3-2)"
    - source: 317453-006 r4.0
      locator: "13.4.29 Receive Descriptor Tail (RDT)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-006
  statement: >-
    Because head equal to tail means the ring is empty, software can give the hardware at most
    (ring size - 1) receive descriptors at a time. The tail must never be advanced to equal the
    head from behind.
  class: inference
  premises:
    - text: Hardware owns descriptors in the range from head up to tail; head equal to tail means the ring is empty.
      source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure, Note following Figure 3-2"
    - text: Tail identifies the location beyond the last descriptor hardware can process.
      source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure, Receive Descriptor Tail register (RDT) bullet"
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    The manual never states the N-1 limit outright. It follows from the empty-ring definition,
    because a full ring would look the same as an empty one. The initialization example (RDH=0,
    RDT=N-1) would confirm it.

- id: E1000-RX-007
  statement: >-
    Software detects completed receive descriptors by the Descriptor Done bit (status bit 0) in host
    memory, not by reading RDH. The manual says reading the head register to find finished buffers
    is not reliable.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.28 Receive Descriptor Head (RDH)"
    - source: 317453-006 r4.0
      locator: "3.2.3.1 Receive Descriptor Status Field, Table 3-2 (DD bit 0)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-008
  statement: >-
    A received packet is complete in memory only when the descriptor has both DD (status bit 0) and
    EOP (status bit 1) set. A packet can span several descriptors. On those without EOP only the
    address, length, and DD are meaningful, and the error field is valid only on the EOP
    descriptor.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.3.1 Receive Descriptor Status Field, Table 3-2 (EOP bit 1, DD bit 0)"
    - source: 317453-006 r4.0
      locator: "3.2.3.2 Receive Descriptor Errors Field"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-009
  statement: >-
    The length the hardware writes back counts the bytes stored in that buffer. That includes the
    4-byte Ethernet CRC unless CRC stripping (RCTL.SECRC, bit 26) is enabled.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.3 Receive Descriptor Format"
    - source: 317453-006 r4.0
      locator: "13.4.22 Receive Control Register (RCTL), Table 13-67, SECRC bit 26"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-010
  statement: >-
    The receive buffer size programmed in RCTL.BSIZE (bits 17:16) with RCTL.BSEX (bit 25) must not
    exceed the buffers software actually provides. With BSEX = 0 the choices are 2048 (00b), 1024,
    512, and 256 bytes. The hardware writes up to that many bytes into each buffer.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.22 Receive Control Register (RCTL), Table 13-67, BSIZE bits 17:16 and BSEX bit 25"
    - source: 317453-006 r4.0
      locator: "14.4 Receive Initialization"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-011
  statement: >-
    To receive unicast frames addressed to the station, the MAC address must be in RAL0 (5400h, low
    32 bits) and RAH0 (5404h, high 16 bits), with RAH0 address-select = 00b (destination address) and
    Address Valid (bit 31) set. Bytes go in wire order, the first byte on the wire in RAL bits 7:0.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.5.2 Receive Address Low (RAL), Table 13-90; 13.5.3 Receive Address High (RAH), Table 13-91 (AS, AV)"
    - source: 317453-006 r4.0
      locator: "2.5 Ethernet Addressing"
    - source: 317453-006 r4.0
      locator: "14.4 Receive Initialization"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-012
  statement: >-
    Broadcast frames are accepted only when RCTL.BAM (bit 15) is set. It resets to 0.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.22 Receive Control Register (RCTL), Table 13-67, BAM bit 15"
    - source: 317453-006 r4.0
      locator: "14.4 Receive Initialization"
  weight: critical
  in_scope: true
  status: active
  notes: Without broadcast, ARP requests are never seen, so IPv4 does not work.

- id: E1000-RX-013
  statement: >-
    A software scheme that finds completed descriptors by scanning memory must clear each
    descriptor's status byte before handing the descriptor back to hardware. Hardware does not
    clear it, and a stale DD bit would look like a new packet.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.2.6 Receive Descriptor Queue Structure (paragraph on zeroing the status byte)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-RX-014
  statement: >-
    Clearing RCTL.EN stops reception after any packet in progress, but leaves data in the receive
    FIFO and does not reinitialize the logic that marks packet boundaries in the FIFO. The receiver
    must therefore be reset before it is enabled again.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.22 Receive Control Register (RCTL), Table 13-67, EN bit 1"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Reworded after the second reading to state only what the manual says ("the receiver must be
    reset"). The manual names no receiver-only reset for this part: RCTL bit 0 is reserved, even
    though 13.4.28 mentions an RCTL.RST. That leaves CTRL.RST as the available mechanism, which is
    an inference (see E1000-INIT-006).

- id: E1000-RX-015
  statement: >-
    Software may write RDH only after a reset and before the receiver is enabled. Writing it while
    receive is enabled can invalidate the device's on-chip descriptor state.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.28 Receive Descriptor Head (RDH)"
  weight: critical
  in_scope: true
  status: active
  notes: Split out of E1000-RX-004 after the second reading.

# ---------------------------------------------------------------- TX
- id: E1000-TX-001
  statement: >-
    A legacy transmit descriptor is 16 bytes. Bytes 0-7 hold the 64-bit buffer address, bytes 8-9
    the buffer length, byte 10 the checksum offset, byte 11 the command, the low nibble of byte 12
    the status, byte 13 the checksum start, and bytes 14-15 the special field.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.3.3 Legacy Transmit Descriptor Format, Table 3-8 Transmit Descriptor (TDESC) Layout - Legacy Mode"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-002
  statement: >-
    The transmit ring base (TDBAL/TDBAH at 3800h/3804h) must be 16-byte aligned. The low four
    address bits are ignored.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.36 Transmit Descriptor Base Address Low (TDBAL), Table 13-79"
    - source: 317453-006 r4.0
      locator: "14.5 Transmit Initialization"
  weight: critical
  in_scope: true
  status: active
  notes: Split after the second reading. The TDLEN part is now E1000-TX-013.

- id: E1000-TX-003
  statement: >-
    At initialization software writes 0 to both TDH (3810h) and TDT (3818h). It writes TDH only
    after a reset and before the transmitter is enabled, never while transmit is enabled.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "14.5 Transmit Initialization"
    - source: 317453-006 r4.0
      locator: "13.4.39 Transmit Descriptor Head (TDH)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-004
  statement: >-
    Software queues packets by filling descriptors starting at the current tail and then writing
    TDT with the index one past the last new descriptor. Hardware transmits everything between head
    and tail, and the queue is empty when head equals tail.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure"
    - source: 317453-006 r4.0
      locator: "13.4.40 Transmit Descriptor Tail (TDT)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-005
  statement: >-
    Descriptor contents must be visible in memory (coherent with any CPU cache, and ordered) before
    the TDT write that hands them to hardware. The device prefetches descriptors aggressively as
    soon as the tail moves.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.4.1 Transmit Descriptor Fetching"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Stated for transmit. 3.2.4 Receive Descriptor Fetching describes the same fetch-on-tail-write
    behavior, so the receive tail write has the same ordering need; that part is inference.

- id: E1000-TX-006
  statement: >-
    The last descriptor of each packet must have EOP (command bit 0) set. The insert-FCS, insert-
    checksum, and VLAN command bits are only honored on the EOP descriptor.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.3.3.1 Transmit Descriptor Command Field Format, Table 3-10 and Notes (EOP bit 0)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-007
  statement: >-
    For the hardware to append the Ethernet CRC, the EOP descriptor must also have IFCS (command
    bit 1) set. Otherwise software must supply the FCS itself.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.3.3.1 Transmit Descriptor Command Field Format, Table 3-10 (IFCS bit 1)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-008
  statement: >-
    Hardware writes back descriptor status, setting DD (status bit 0), only for descriptors whose
    Report Status bit (command bit 3) is set. A driver that reclaims by DD must set RS on the
    descriptors it will check.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.3.3.1 Transmit Descriptor Command Field Format, Table 3-10 (RS bit 3) and Notes"
    - source: 317453-006 r4.0
      locator: "3.3.3.2 Transmit Descriptor Status Field Format, Table 3-11 (DD bit 0)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-009
  statement: >-
    Transmit completion must be found by checking DD in the descriptor in memory, not by reading
    TDH. A head read can pass buffered descriptor writes and the manual calls it unreliable.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure (race condition paragraph)"
    - source: 317453-006 r4.0
      locator: "13.4.39 Transmit Descriptor Head (TDH)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-TX-010
  statement: >-
    Short frames are padded to the 64-byte Ethernet minimum only when TCTL.PSP (bit 3) is set. It
    resets to 0, and initialization is expected to set it.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.33 Transmit Control Register (TCTL), Table 13-76, PSP bit 3"
    - source: 317453-006 r4.0
      locator: "14.5 Transmit Initialization"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Table 3-9 separately says the packet before padding and CRC must be at least 48 bytes. That
    conflicts with the PSP description (pads to 64) and with the 32-byte minimum it quotes when
    PSP is off. A checker should accept either a spec that pads in software to the minimum or
    one that relies on PSP, but it should flag a spec that relies on neither.

- id: E1000-TX-011
  statement: >-
    The transmitter runs only while TCTL.EN (bit 1) is set. It resets to 0 and software must set it.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.33 Transmit Control Register (TCTL), Table 13-76, EN bit 1"
    - source: 317453-006 r4.0
      locator: "14.5 Transmit Initialization"
  weight: critical
  in_scope: true
  status: active
  notes: Split after the second reading. The COLD part is now E1000-TX-014.

- id: E1000-TX-012
  statement: >-
    TIPG (0410h) has no defined reset value and must be programmed. For the 82540EM on copper, the
    back-to-back gap field IPGT (bits 9:0) is 10.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.34 Transmit IPG Register (TIPG), Table 13-77 (IPGT, initial X)"
    - source: 317453-006 r4.0
      locator: "14.5 Transmit Initialization (TIPG value table)"
    - source: 317453-006 r4.0
      locator: "14.7 Reset Operation, RST# and Global Reset register tables (TIPG listed among transmit registers not reset)"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    IPGR1 and IPGR2 affect only half duplex. The 14.5 table lists 10 and 10 for non-82544 copper
    parts, while the TIPG register description says 8 and 6. The register definition governs
    (8 and 6), but a spec using 10/10 should be judged ambiguous, not wrong. After the second
    reading, 14.7 was added: TIPG is not reset by RST# or by a global reset, so it must be set
    explicitly.

- id: E1000-TX-013
  statement: >-
    TDLEN (3808h) holds the transmit ring size in bytes and must be a multiple of 128 (its low
    7 bits read as zero).
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.38 Transmit Descriptor Length (TDLEN), Table 13-81"
    - source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure; 14.5 Transmit Initialization"
  weight: critical
  in_scope: true
  status: active
  notes: Split out of E1000-TX-002 after the second reading.

- id: E1000-TX-014
  statement: >-
    TCTL's collision-distance field (COLD, bits 21:12) resets to 0 and must be programmed: 40h for
    full duplex and for 10/100 half duplex, 200h for gigabit half duplex.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.33 Transmit Control Register (TCTL), Table 13-76, COLD bits 21:12"
    - source: 317453-006 r4.0
      locator: "14.5 Transmit Initialization"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Split out of E1000-TX-011 after the second reading. The collision threshold (CT, bits 11:4)
    matters only in half duplex. TCTL's own table recommends 0Fh while 14.5 says 10h; the register
    definition governs.

- id: E1000-TX-015
  statement: >-
    A transmit descriptor is read as legacy only when its DEXT bit (command bit 5, descriptor bit
    29) is 0. With DEXT set, the hardware reads it as an extended context or data descriptor
    instead.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.3.2 Transmit Descriptors, Table 3-7 Transmit Descriptor (TDESC) Layout"
    - source: 317453-006 r4.0
      locator: "3.3.3 Legacy Transmit Descriptor Format; 3.3.3.1 Transmit Descriptor Command Field Format, Table 3-10 (DEXT bit 5)"
  weight: critical
  in_scope: true
  status: active
  notes: Added after the second reading (reader's missing requirement 1).

- id: E1000-TX-016
  statement: >-
    Once a transmit descriptor is handed to hardware, software must not change the descriptor (or
    reuse its buffer) until the head has advanced past it. In practice software waits for DD on a
    descriptor with RS set.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure (descriptors passed to hardware not to be manipulated until head advances past them)"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Added after the second reading (reader's missing requirement 2). E1000-TX-009 covers how
    completion is observed.

- id: E1000-TX-017
  statement: >-
    Because head equal to tail means the transmit queue is empty, at most (ring size - 1)
    descriptors can be outstanding. Software must never advance TDT until it equals TDH.
  class: inference
  premises:
    - text: Transmission continues up to the descriptor where head equals tail, at which point the queue is empty.
      source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure"
    - text: The tail points one entry beyond the last hardware-owned descriptor, still within the ring.
      source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure; 13.4.40 Transmit Descriptor Tail (TDT)"
  derivation:
    - source: 317453-006 r4.0
      locator: "3.4 Transmit Descriptor Ring Structure"
  weight: critical
  in_scope: true
  status: active
  notes: >-
    Added after the second reading (reader's missing requirement 3); the transmit counterpart of
    E1000-RX-006. The manual never states the limit; it follows from the empty-queue definition.
    Filling every slot would make the ring look empty, and nothing would be sent.

# ---------------------------------------------------------------- IRQ
- id: E1000-IRQ-001
  statement: >-
    Reading ICR (00C0h) returns and clears every pending cause bit, which acknowledges them. Writing
    1 to an ICR bit also clears it, and writing 0 has no effect.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.17 Interrupt Cause Read Register (ICR)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-IRQ-002
  statement: >-
    The device raises its interrupt only while a cause bit and the matching mask bit are both 1.
    Cause bits latch events whether or not they are masked.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "2.6 Interrupts"
    - source: 317453-006 r4.0
      locator: "13.4.21 Interrupt Mask Clear Register (IMC)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-IRQ-003
  statement: >-
    Writing 1 to a bit of IMS (00D0h) enables that interrupt and writing 0 changes nothing. Reading
    IMS returns the current mask.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.20 Interrupt Mask Set/Read Register (IMS)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-IRQ-004
  statement: >-
    Interrupts are disabled only by writing 1 to the corresponding bits of IMC (00D8h), a write-only
    register. Writing 0 to IMS does not disable anything.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.20 Interrupt Mask Set/Read Register (IMS)"
    - source: 317453-006 r4.0
      locator: "13.4.21 Interrupt Mask Clear Register (IMC)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-IRQ-005
  statement: >-
    ICR cause bit positions a core driver needs: 0 TXDW (transmit descriptor written back), 1 TXQE
    (transmit queue empty), 2 LSC (link status change), 4 RXDMT0 (receive descriptors below
    threshold), 6 RXO (receive overrun), 7 RXT0 (receive timer). IMS and IMC use the same bit
    positions.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.17 Interrupt Cause Read Register (ICR), Table 13-63 ICR Register Bit Description"
    - source: 317453-006 r4.0
      locator: "13.4.20 Interrupt Mask Set/Read Register (IMS), Table 13-65"
  weight: critical
  in_scope: true
  status: active

- id: E1000-IRQ-006
  statement: >-
    ICR bit 2 (LSC) is set on every link up or down transition. On it, the driver must re-read link
    state (STATUS) instead of assuming which direction the link changed.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.17 Interrupt Cause Read Register (ICR), Table 13-63, LSC bit 2"
    - source: 317453-006 r4.0
      locator: "8.6.5.2 Internal PHY Mode (Loss of Signal/Link Status Indication)"
  weight: critical
  in_scope: true
  status: active

- id: E1000-IRQ-007
  statement: >-
    ITR (00C4h) sets a minimum gap between interrupts in units of 256 ns (bits 15:0), and 0 disables
    throttling. The reset value is 0, so interrupts are unthrottled unless the driver programs it.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.4.18 Interrupt Throttling Register (ITR)"
  weight: important
  in_scope: true
  status: active

# ---------------------------------------------------------------- STAT
- id: E1000-STAT-001
  statement: >-
    Every statistics register clears when read. A driver must accumulate the values it reads rather
    than treat each read as a running total.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.7 Statistics Registers"
  weight: important
  in_scope: true
  status: active
  notes: >-
    Weight lowered from critical after the second reading. Misreading the counters gives wrong
    statistics, but the driver still works and no data is corrupted.

- id: E1000-STAT-002
  statement: >-
    The 64-bit octet counters (for example GORCL/GORCH at 4088h/408Ch, GOTCL/GOTCH at 4090h/4094h)
    reset when the upper half is read. Software must read the low half first and the high half
    second.
  class: inference
  premises:
    - text: 64-bit statistics registers reset whenever the upper 32 bits are read.
      source: 317453-006 r4.0
      locator: "13.7 Statistics Registers; 13.7.31 Good Octets Received Count (GORCL/GORCH)"
  derivation:
    - source: 317453-006 r4.0
      locator: "13.7 Statistics Registers"
  weight: important
  in_scope: true
  status: active
  notes: >-
    Reading the high half first would reset the counter before the low half is read, losing the low
    part. The manual states the reset trigger, not the read order.

- id: E1000-STAT-003
  statement: >-
    Packets dropped because the receive FIFO had no room are counted in MPC (4010h). Packets that
    arrived while no host receive descriptors were available are counted in RNBC (40A0h). These are
    the counters that expose a starved receive ring.
  class: documented-hardware-requirement
  derivation:
    - source: 317453-006 r4.0
      locator: "13.7.5 Missed Packets Count (MPC); 13.7.33 Receive No Buffers Count (RNBC)"
  weight: important
  in_scope: true
  status: active

