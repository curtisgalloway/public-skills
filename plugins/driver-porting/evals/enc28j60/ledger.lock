#
# The freeze record for the ENC28J60 gold ledger, EVAL-PLAN.md phase 2.
#
# From here on `ledger_check.py ledger.yaml --lock ledger.lock` refuses any edit to the ledger,
# the corpus manifest, the scoring policy, the ledger format or the fact lists, and a scored run
# cites this lock. A digest says whether bytes changed; the revision is how someone gets them
# back. A correction found after a candidate has been read takes a new version and a declared
# rescoring procedure, never a quiet edit here.

