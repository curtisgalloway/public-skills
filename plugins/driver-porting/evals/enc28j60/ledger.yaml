- id: ENC28J60-PHY-011
  statement: >-
    The reset value of PHCON1.PDPXMD (and therefore of PHSTAT2.DPXSTAT) is sampled from the LEDB pin
    wiring at reset: an LED the pin sources current into gives half duplex, an LED it sinks from gives
    full duplex, and no LED gives an indeterminate value. Whether a driver may rely on that reset
    value, and what to do when it cannot, is ENC28J60-PHY-012.
  class: documented-hardware-requirement
  derivation:
  - source: DS39662E
    locator: section 2.6 LED configuration; section 6.6; table 3-3 note 1
  - source: DS39662E
    locator: >-
      section 2.6 LED Configuration, LEDB paragraph and Figure 2-7; section 6.6; Table 3-3 note 1
  applicability:
    vendor_confirmed: []
    implementation_observed: true
    unresolved: false
  weight: important
  readers:
  - A
  - B
  in_scope: true
  recoverable: true
  status: active
  notes: >-
    Reader B adds: The driver always writes PDPXMD explicitly. The LED-polarity erratum (ENC28J60-PHY-023)
    makes the reset value even less trustworthy.


    Merged with draft B ENC28J60-PHY-009.
- id: ENC28J60-PHY-012
  statement: >-
    On any system where the reset-derived duplex setting cannot be trusted, the driver should program
    PHCON1.PDPXMD explicitly rather than rely on its reset value: the reset value depends on LED
    wiring (indeterminate with no LED) and can be wrong when the LED polarity is misdetected.
    DS39662E section 6.6 permits an externally configured design that reads PDPXMD and programs
    FULDPX to match, so this is not a universal obligation.
  class: inference
  premises:
  - >-
    ENC28J60-PHY-011 makes the reset value a function of board wiring and possibly indeterminate
  - >-
    DS80349C issue 16 states that a misdetected LEDB also resets PDPXMD to the incorrect state
  - >-
    ENC28J60-PHY-009 requires PDPXMD to match MACON3.FULDPX, which the driver sets itself
  - >-
    DS39662E section 2.6 says PDPXMD's reset value comes from LEDB wiring and is indeterminate with
    no LED.
  - >-
    DS39662E section 6.6 says the host must program the bit if the external circuitry is absent or
    incorrect.
  - >-
    DS80349C issue 16 says the LED polarity detection itself can misread on any revision, which can
    set PDPXMD wrong even with correct wiring.
  derivation:
  - source: DS80349C
    locator: silicon issue 16 (PHY LEDs), last sentence of the description
  - source: DS39662E
    locator: section 6.6 PHY initialization settings
  - source: DS39662E
    locator: section 2.6 LED Configuration; section 6.6 PHY Initialization Settings
  - source: DS80349C
    locator: silicon issue 16 (PHY LEDs)
  - source: drivers/net/ethernet/microchip/enc28j60.c
    locator: hardware initialization, the PHCON1 write in both duplex branches
  confidence: high
  settled_by: >-
    A vendor statement requiring explicit programming, or observing on hardware that a misdetected
    LEDB leaves PDPXMD wrong after reset.


    Reader B: A vendor statement that reading PDPXMD after reset is a supported way to detect board
    configuration on affected silicon; the datasheet's own alternative (read PDPXMD, program FULDPX
    to match) is the reading this row argues against.
  applicability:
    vendor_confirmed:
    - B1
    - B4
    - B5
    - B7
    implementation_observed: true
    unresolved: false
  weight: important
  readers:
  - A
  - B
  in_scope: true
  recoverable: true
  status: active
  notes: >-
    Narrowed from "always" on 2026-09-19: section 6.6 allows the externally configured design and
    issue 16 offers a board-level workaround, so the recommendation holds where the reset value
    cannot be trusted, not universally. The driver writes PHCON1 whole (PDPXMD set or clear) on
    every initialization.


    Reader B adds: The datasheet permits the opposite design (letting the board choose and reading
    the bit); the errata make that design unreliable. The driver does what this row recommends.


    Merged with draft B ENC28J60-PHY-019.
