#
# Merged from two blind drafts, A (175 rows) and B (171 rows), each authored from the frozen
# corpus without sight of the other or of any candidate specification. Conventions:
# - IDs: a row that came from draft A keeps A's ID. A row found only by B has the next unused
#   number in its facet after A's highest, and `notes` says which B row it came from. Nothing is
#   renumbered or reused.
# - `readers` names the drafts that stated the row. `weight_disputed` records both weights where
#   they differed; the row's `weight` is the higher one, provisionally.
# - `vendor_confirmed` lists silicon revisions only for errata-derived rows, from DS80349C Table 2
#   as rendered (issue 1: B1 and B4; issue 3: B1 and B4; issue 8: B1 and B4; issue 13: B5 and B7;
#   every other silicon issue: all four; Table 3 conformance items: B1 and B4). An empty list means the row is not
#   errata-derived, never "no revision affected".
# - Driver sources are cited by path at Linux v6.12, commit adc218676eef25575469234709c2d87185ca223a;
#   locators name functions or mechanisms, never line ranges. Data sheet section numbers are
#   DS39662E's unless a row says it read DS39662C.
# - The companion conflict log (ledger-conflict-log.md) lists every disagreement for adjudication.
pilot: enc28j60
corpus_frozen: 2026-09-19
authored: 2026-09-19
merged: 2026-09-19
author: merged from blind drafts A and B
authoring_rule: blind, from corpus.yaml pins only; no candidate specification read
readers_rule: >-
  Same requirement, both agree: one row, readers [A, B], derivations unioned, applicability merged
  (vendor_confirmed union; implementation_observed true if either said so and the corpus supports
  it; unresolved only if both said so or neither source settles it). Same requirement, class
  differs: settled from the cited vendor text where possible, otherwise A's class kept and logged.
  Same requirement, weight differs: the higher weight taken provisionally with weight_disputed
  recording both, for the adjudicator to overturn. Same requirement, facts differ: class
  unresolved-conflict with both readings kept (no such row arose in this merge). A requirement one
  reader found and the other did not is kept with readers [A] or [B]; critical ones are logged.
