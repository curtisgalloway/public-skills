- id: ENC28J60-REG-005
  statement: >-
    Register group membership follows the data sheet's name prefixes: a name beginning E identifies
    an ETH register, MA a MAC register and MI an MII register. Bank 3 holds members of different
    groups, so EREVID, ECOCON, EFLOCON and the EBST registers are ETH registers while MISTAT and the
    MAADR registers are not.
  class: documented-hardware-requirement
  derivation:
  - source: DS39662E
    locator: section 3.1, paragraph on ETH, MAC and MII groups; section 4.2.1
  applicability:
    vendor_confirmed: []
    implementation_observed: true
    unresolved: false
  weight: critical
  readers:
  - A
  independent_review:
    reviewer: >-
      Reader C, 2026-09-20. A third reader working from the frozen corpus alone, without sight of
      this row or any other requirement on the subject, and without searching for one; the
      reference driver was read for mechanism under the clean-room rule and never quoted.
    locators:
    - >-
      DS39662E section 3.1 (Control Registers), the ETH, MAC and MII grouping and the name-prefix
      rule that determines membership
    - >-
      DS39662E section 4.2.1 (Read Control Register Command) with Figure 4-3 (ETH registers, 16
      clocks) and Figure 4-4 (MAC and MII registers, 24 clocks, a dummy byte before the data)
    - >-
      DS39662E Table 3-1 (Control Register Map), bank 3 column, the names and addresses of every
      bank 3 register
    - >-
      DS39662E Register 3-4 (MISTAT), whose own heading corroborates its MII membership, and
      Table 3-2, which describes MAADR1 to MAADR6 as the MAC address bytes
    - >-
      DS39662E sections 4.2.5 and 4.2.6 (Bit Field Set and Bit Field Clear), both restricted to
      ETH control registers, and Table 16-6 parameter 2, whose CS hold time is 10 ns for ETH
      registers against 210 ns for MAC and MII
    - >-
      DS39662C section 3.1, Table 3-1 and section 4.2.1 with the same figures, as an edition check
    - >-
      DS80349B and DS80349C, whole documents, as a negative locator, since neither edition
      mentions the Read Control Register command, its framing, or the dummy byte
    disposition: >-
      Supported. The corpus establishes as a hardware requirement that a Read Control Register on
      a MAC or MII register returns a leading dummy byte while an ETH register read returns the
      data immediately, and it settles each bank 3 register's group. One qualification the reader
      raised: the data sheet prints no per-register group column, so EREVID's ETH membership rests
      on the section 3.1 name-prefix rule rather than on a direct statement. That is the case this
      row exists for, since bank 3 is mixed and EREVID is read with the short framing. The reading
      covered both the grouping and the read framing, and the row was narrowed to the grouping on
      2026-09-20: what now supports it is the section 3.1 name-prefix rule together with the bank 3
      column of Table 3-1 and Register 3-4, which settle membership. The framing the same reading
      established from Figures 4-3 and 4-4, and the hold times it took from Table 16-6, now support
      ENC28J60-SPI-009 and ENC28J60-SPI-016, which own those clauses.
  in_scope: true
  recoverable: true
  status: active
  notes: >-
    The driver marks exactly the MA and MI registers with its dummy-read flag, so its classification
    matches the data sheet's.


    Narrowed 2026-09-20: this row states membership only. The dummy byte a MAC or MII read returns
    is ENC28J60-SPI-009 and the longer CS hold time those groups need is ENC28J60-SPI-016; both were
