- id: ENC28J60-PHY-018
  statement: >-
    PHCON2 bit layout: FRCLNK bit 14 (force link up), TXDIS bit 13 (disable the twisted-pair transmitter),
    JABBER bit 10 (disable jabber correction), HDLDIS bit 8; bits 12-11, 9 and 7-0 are reserved and
    written as 0.
  class: documented-hardware-requirement
  derivation:
  - source: DS39662E
    locator: register 6-5 PHCON2
  - source: DS39662E
    locator: Register 6-5 PHCON2
  applicability:
    vendor_confirmed: []
    implementation_observed: true
    unresolved: false
  weight: critical
  readers:
  - A
  - B
  in_scope: true
  recoverable: true
  status: active
  notes: >-
    Weight justification (critical, the adjudicator's answer of 2026-09-20): PHCON2 holds HDLDIS,
    and a driver written from a specification that omits the layout leaves half-duplex loopback
    enabled, so every transmitted packet is looped back into the receive path (DS39662E section
    9.1, Register 6-5: with PHCON1<8> and PHCON1<14> clear, HDLDIS = 0 loops transmitted data back
    to the MAC). The reserved bits the row also enumerates must be written 0. The earlier note
    placing the row by whether the driver only reads the register is gone: that rule was withdrawn
    as unsound, and it was factually wrong here, since the driver writes PHCON2 in both duplex
    branches.


    Weight recorded 2026-09-20 against the operating envelope in `SCORING-POLICY.md` ("The
    operating envelope the weights assume"): the envelope includes interoperating with a link
    partner in either duplex, and half duplex is the device's reset default and what a partner
    using autonegotiation settles on (ENC28J60-PHY-010), so a driver cannot avoid the half-duplex
    consequence by declaring itself full duplex only.


    Merged with draft B ENC28J60-PHY-013.
