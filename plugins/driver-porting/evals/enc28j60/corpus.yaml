#
# Phase 1 of EVAL-PLAN.md: the frozen reference corpus for the ENC28J60 pilot.
#
# This file pins every source the gold ledger (phase 2) may be authored from. Frozen means each
# item is identified by a hash, a commit, or a document edition, so the same inputs can be
# reconstructed later and a ledger row can name what it was derived from. Nothing here grades a
# specification; this is the input side only.
#
# The PDFs are pinned by hash, not vendored: they are Microchip's to distribute. Re-fetch from the
# recorded url and check the sha256 before use. A hash that no longer matches means the vendor
# replaced the file under a url that does not name an edition -- record that and do not proceed on
# the assumption that it is the same document.

pilot: enc28j60
frozen: 2026-09-19
device: Microchip ENC28J60, stand-alone Ethernet controller with SPI host interface

silicon_revisions:
  # Errata DS80349C Table 1: EREVID is read-only at address 12h in bank 3 of the control register
  # space. Recorded as printed -- note that B7 reads 0000 0110, which is not what a reader who
  # assumed the value tracked the revision number would predict.
  register: EREVID, bank 3, address 0x12, read-only
  values:
    B1: 0b00000010
    B4: 0b00000100
    B5: 0b00000101
    B7: 0b00000110
  current_at_errata_c: B7

driver:
  # The reference implementation. Pinned so that "the driver does X" in a ledger row is checkable
  # against one exact text. GPL-2.0-only: read under the os-investigator rule, never quoted into a
  # clean-side artifact.
  repo: https://github.com/torvalds/linux
  tag: v6.12
  tag_object: 06090c9b622a7e1f797e775db4c035e0d779b76e
  commit: adc218676eef25575469234709c2d87185ca223a
  tagged: 2024-11-17
  license: GPL-2.0-only
  files:
    - path: drivers/net/ethernet/microchip/enc28j60.c
      bytes: 45062
      sha256: 9fb940a540749bb10d662792af4e1babb2f0cdc7bd6ceff08811b0fcd245c5f0
      git_blob: d6c9491537e47c58947291bd1c3271a137e26951
    - path: drivers/net/ethernet/microchip/enc28j60_hw.h
      bytes: 8952
      sha256: 2a90e04f93d2099ad8c67942c3564184594865dee322e050c912cddc5957fa62
      git_blob: da4ab172527d4201f58e260cb71ef289e42181a2

documents:
  # Every edition Microchip currently serves, not only the newest: a driver comment citing a bare
  # issue number has to be resolved against the edition its author had, and that edition is often
  # not the current one. DS39662F and DS80349A/D/E/F answered HTTP 403 on 2026-09-19 at the same
  # url pattern, which means not served there -- not that they do not exist.
  datasheet:
    id: DS39662
    title: ENC28J60 Data Sheet, Stand-Alone Ethernet Controller with SPI Interface
    url_pattern: https://ww1.microchip.com/downloads/en/DeviceDoc/39662<rev>.pdf
    editions:
      - {rev: A, year: 2004, pages: 102, bytes: 1715036, sha256: ec7d4e97af3484ed6791792c8dacf8ff4bbfcf72bf2b96449825197faf6d4d8a}
      - {rev: B, year: 2006, pages: 96,  bytes: 1497137, sha256: 7c6f3be23f04368f61169673593de0c61faf7de5e6b5eb42c022efe85e31c375}
      - {rev: C, year: 2008, pages: 98,  bytes: 1669587, sha256: 652499e9323861bf675e9ad9dba86102bb1a3b84e1dea65331d03756a798cef2}
      - {rev: D, year: 2012, pages: 102, bytes: 1241668, sha256: 2b6fd54b156a3d00adc5727f94aace7f8939c29f7bdb0fe966127826452ccfbd}
      - {rev: E, year: 2012, pages: 102, bytes: 1301498, sha256: b52e8531a128c7590ce2775b27497139e309d3fd14f0865a87d85546afaf004c}
    current: E
  errata:
    id: DS80349
    title: ENC28J60 Silicon Errata and Data Sheet Clarification
    url_pattern: https://ww1.microchip.com/downloads/en/DeviceDoc/80349<rev>.pdf
    editions:
      - {rev: B, year: 2008, pages: 8,  bytes: 109132, sha256: 960a07593ab823238da262ac26088fd7634cf384640d918ced1af39693eb8395, accompanies: DS39662C}
      - {rev: C, year: 2010, pages: 12, bytes: 268050, sha256: 85596d7b954d554eb4b043a299d1977a02dfe3430013cb7736d4d23dd56a53c4, accompanies: DS39662C}
    current: C
    gap: >-
      Both served errata editions state that they accompany DS39662C, while the current data sheet
      edition is DS39662E (2012). No errata edition published against D or E is served at the url
      pattern above. A ledger row that pairs an erratum with a data sheet section must therefore
      say which data sheet edition it read that section in, because the errata never named D or E.

errata_map:
  # The edition-specific map EVAL-PLAN.md's Correction 5 requires. A bare issue number in a driver
  # comment, a mailing list post or a vendor note is meaningless without its edition: the list is
  # renumbered between editions as items are inserted, so the same number names different silicon
  # in B and in C. Resolve every bare number against the edition its author had; where that edition
  # cannot be established, the reference is recorded literally and left unresolved.
  #
  # Both editions also carry a SECOND, independent numbering for data sheet clarifications, which
  # restarts at 1. "Issue 1" is ambiguous within a single edition unless the sequence is named.
  DS80349B:
    silicon_issues:
      1:  {module: Reset,                       summary: PHY state after an SPI Reset command}
      2:  {module: Oscillator (CLKOUT Pin),     summary: no CLKOUT output in Power Save mode}
      3:  {module: Memory (Ethernet Buffer),    summary: receive hardware internal write pointer}
      4:  {module: Interrupts,                  summary: Receive Packet Pending interrupt flag unreliable}
      5:  {module: PHY,                         summary: automatic polarity detection and correction}
      6:  {module: PHY,                         summary: recommended external RBIAS resistor value}
      7:  {module: PHY,                         summary: half-duplex loopback mode}
      8:  {module: PHY,                         summary: full-duplex loopback mode}
      9:  {module: PHY LEDs,                    summary: PHLCON programming}
      10: {module: Transmit Logic,              summary: half-duplex hardware transmission}
      11: {module: Memory (Ethernet Buffer),    summary: receive hardware may corrupt the circular buffer}
      12: {module: Transmit Logic,              summary: collision after 64 bytes have been transmitted}
      13: {module: PHY,                         summary: half-duplex transmission with some magnetics}
      14: {module: PHY,                         summary: LED auto-polarity detection with some LEDs}
      15: {module: DMA,                         summary: DMA operated in Checksum mode}
    datasheet_clarifications: {count: unrecorded, note: "separate sequence restarting at 1; not enumerated this pass"}
  DS80349C:
    silicon_issues:
      # affected lists are read from Table 2 (Silicon Issue Summary) on page 2 of DS80349C.
      # Issue 1 was first recorded here as [B5, B7]; a blind ledger author reading the extracted
      # text flagged it, and the rendered page shows X under B1 and B4 only. Corrected 2026-09-19.
      1:  {module: MAC Interface,               summary: MAC registers unreliable with a slow asynchronous SPI clock, affected: [B1, B4]}
      2:  {module: Reset,                       summary: CLKRDY set early, affected: [B1, B4, B5, B7]}
      3:  {module: Core (Operating Specifications), summary: industrial temperature range unsupported, affected: [B1, B4]}
      4:  {module: Oscillator (CLKOUT Pin),     summary: CLKOUT unavailable in Power Save mode, affected: [B1, B4, B5, B7]}
      5:  {module: Memory (Ethernet Buffer),    summary: receive buffer must start at 0x0000, affected: [B1, B4, B5, B7]}
      6:  {module: Interrupts,                  summary: Receive Packet Pending interrupt flag (PKTIF) unreliable, affected: [B1, B4, B5, B7]}
      7:  {module: PHY,                         summary: TPIN+/- automatic polarity detection and correction unreliable, affected: [B1, B4, B5, B7]}
      8:  {module: PHY,                         summary: RBIAS resistor value differs between silicon revisions, affected: [B1, B4]}
      9:  {module: PHY,                         summary: internal loopback in half-duplex unreliable, affected: [B1, B4, B5, B7]}
      10: {module: PHY,                         summary: full-duplex loopback mode, affected: [B1, B4, B5, B7]}
      11: {module: PHY LEDs,                    summary: PHLCON programming, affected: [B1, B4, B5, B7]}
      12: {module: Transmit Logic,              summary: half-duplex hardware transmission, affected: [B1, B4, B5, B7]}
      13: {module: PHY,                         summary: half-duplex transmission with some magnetics, affected: [B5, B7]}
      14: {module: Memory (Ethernet Buffer),    summary: receive hardware may corrupt the circular buffer, affected: [B1, B4, B5, B7]}
      15: {module: Transmit Logic,              summary: collision after 64 bytes have been transmitted, affected: [B1, B4, B5, B7]}
      16: {module: PHY LEDs,                    summary: LED auto-polarity detection with some LEDs, affected: [B1, B4, B5, B7]}
      17: {module: DMA,                         summary: DMA operated in Checksum mode, affected: [B1, B4, B5, B7]}
      18: {module: Receive Filter,              summary: Pattern Match receive filter, affected: [B1, B4, B5, B7]}
      19: {module: SPI Interface,               summary: operation in Power Save mode, affected: [B1, B4, B5, B7]}
    datasheet_clarifications:
      1: {module: Receive Filter, summary: "Section 8.2 Pattern Match Filter"}
      note: "separate sequence restarting at 1; only the first is enumerated this pass. A clarification is not revision-specific; the affected column does not apply, and a ledger row citing one records all four revisions"
    conformance_issues:
      # Table 3 (Ethernet Conformance Issues) of DS80349C, page 2: a third numbering sequence,
      # all three marked B1 and B4 only. Informational for B5 and later.
      1: {summary: TP_IDL transmit waveform violates the IEEE 802.3 template, affected: [B1, B4]}
      2: {summary: PHY accepts a receive packet in the Link Test Fail state, affected: [B1, B4]}
      3: {summary: collision enforcement is delayed, affected: [B1, B4]}

renumbering:
  # The worked example of why the edition matters. Same subject, different number.
  examples:
    - subject: collision after 64 bytes have been transmitted
      DS80349B: 12
      DS80349C: 15
    - subject: receive hardware may corrupt the circular buffer
      DS80349B: 11
      DS80349C: 14
    - subject: DMA operated in Checksum mode
      DS80349B: 15
      DS80349C: 17
  note: >-
    Issues 1 and 3 of DS80349C (MAC interface, industrial temperature range) have no counterpart in
    DS80349B at all, which is what shifts everything below them. A bare "issue 12" resolves to
    transmit-collision behavior under B and to a different transmit-logic item under C.

applicability_columns:
  # EVAL-PLAN.md Correction 2: absence from a vendor document does not prove a device unaffected.
  # Three separate columns, never collapsed into one boolean.
  vendor_confirmed: the errata edition lists the part and revision in its affected-revisions matrix
  implementation_observed: the driver applies a workaround, whatever the errata says
  unresolved: neither establishes the answer; never scored as a proven contradiction
