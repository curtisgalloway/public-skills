name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned by SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Skill registration
        run: python3 utilities/check-skill-registration.py

      - name: No private paths
        run: python3 utilities/check-no-private-paths.py

      - name: agent-agnostic-skills tests
        run: python3 -m unittest discover -s plugins/agent-workflow/skills/agent-agnostic-skills/tests -v

      - name: consult tests
        run: python3 -m unittest discover -s plugins/agent-workflow/skills/consult/tests -v

      - name: quota-strategy tests
        run: python3 -m unittest discover -s plugins/agent-workflow/skills/quota-strategy/tests -v

      - name: dep-quality tests
        run: python3 -m unittest discover -s plugins/dev-tools/skills/dep-quality/tests -v

      - name: review-swarm tests
        run: python3 -m unittest discover -s plugins/dev-tools/skills/review-swarm/tests -v

      - name: release-train tests
        run: python3 -m unittest discover -s plugins/dev-tools/skills/release-train/tests -v
